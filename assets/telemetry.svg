<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%" height="300">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&amp;display=swap');

      .font-mono { font-family: 'JetBrains Mono', monospace; }

      @keyframes fill-grow {
        0% { stroke-dashoffset: 260; }
        100% { stroke-dashoffset: var(--target); }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 3px rgba(255,255,255,0.3)); }
      }
      @keyframes node-pulse {
        0%, 100% { r: 3; opacity: 0.5; }
        50% { r: 5; opacity: 1; }
      }
      @keyframes line-dash {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -20; }
      }
      @keyframes fade-in {
        0% { opacity: 0; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes terminal-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      .bar-fill { animation: fill-grow 2s ease-out forwards; }
      .bar-glow { animation: pulse-glow 2.5s ease-in-out infinite; }
      .node-anim { animation: node-pulse 2s ease-in-out infinite; }
      .line-flow { stroke-dasharray: 4, 4; animation: line-dash 1s linear infinite; }
      .fade-item { animation: fade-in 0.6s ease-out both; }
      .blink-cursor { animation: terminal-blink 1s step-end infinite; }
      .delay-1 { animation-delay: 0.2s; }
      .delay-2 { animation-delay: 0.4s; }
      .delay-3 { animation-delay: 0.6s; }

      .bg-panel { fill: #080808; stroke: #1C1C1C; stroke-width: 1.5; }
      .grid-line { stroke: #111111; stroke-width: 0.6; }

      .bar-track { fill: none; stroke: #181818; stroke-width: 8; stroke-linecap: round; }
      .bar-fill-stroke { fill: none; stroke: #FFFFFF; stroke-width: 8; stroke-linecap: round; }
    </style>

    <pattern id="dot-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#161616" />
    </pattern>
  </defs>

  <!-- Base Panel -->
  <rect width="848" height="298" x="1" y="1" rx="10" class="bg-panel" />
  <rect width="846" height="296" x="2" y="2" fill="url(#dot-grid)" rx="10" />

  <!-- LEFT: Language Radar / HUD -->
  <g transform="translate(0, 0)">
    <!-- Concentric Rings -->
    <circle cx="180" cy="150" r="120" fill="none" stroke="#1A1A1A" stroke-width="0.75" stroke-dasharray="2, 4" />
    <circle cx="180" cy="150" r="95" fill="none" stroke="#1F1F1F" stroke-width="0.75" />
    <circle cx="180" cy="150" r="70" fill="none" stroke="#222222" stroke-width="0.75" />
    <circle cx="180" cy="150" r="45" fill="none" stroke="#1F1F1F" stroke-width="0.75" />
    <circle cx="180" cy="150" r="20" fill="none" stroke="#222222" stroke-width="0.75" stroke-dasharray="2, 2" />

    <!-- Crosshairs -->
    <line x1="50" y1="150" x2="310" y2="150" stroke="#181818" stroke-width="1" />
    <line x1="180" y1="20" x2="180" y2="280" stroke="#181818" stroke-width="1" />
    <line x1="60" y1="30" x2="300" y2="270" stroke="#151515" stroke-width="0.5" stroke-dasharray="3, 3" />
    <line x1="60" y1="270" x2="300" y2="30" stroke="#151515" stroke-width="0.5" stroke-dasharray="3, 3" />

    <!-- Center Node -->
    <circle cx="180" cy="150" r="4" fill="#FFF" opacity="0.8" />
    <circle cx="180" cy="150" r="8" fill="none" stroke="#FFF" stroke-width="0.5" opacity="0.3" class="node-anim" />

    <!-- KOTLIN Node -->
    <g class="fade-item delay-1">
      <circle cx="120" cy="85" r="6" fill="#FFF" opacity="0.9" />
      <line x1="120" y1="85" x2="98" y2="68" stroke="#FFF" stroke-width="0.75" opacity="0.5" />
      <text x="68" y="62" class="font-mono" font-size="10" fill="#FFF" letter-spacing="1">KOTLIN</text>
      <text x="76" y="72" class="font-mono" font-size="7" fill="#666">EXP: 4 yrs</text>
    </g>

    <!-- PYTHON Node -->
    <g class="fade-item delay-2">
      <circle cx="250" cy="100" r="6" fill="#FFF" opacity="0.9" />
      <line x1="250" y1="100" x2="268" y2="85" stroke="#FFF" stroke-width="0.75" opacity="0.5" />
      <text x="272" y="83" class="font-mono" font-size="10" fill="#FFF" letter-spacing="1">PYTHON</text>
      <text x="275" y="93" class="font-mono" font-size="7" fill="#666">EXP: 5 yrs</text>
    </g>

    <!-- C++ Node -->
    <g class="fade-item delay-3">
      <circle cx="160" cy="220" r="6" fill="#FFF" opacity="0.9" />
      <line x1="160" y1="220" x2="140" y2="238" stroke="#FFF" stroke-width="0.75" opacity="0.5" />
      <text x="100" y="248" class="font-mono" font-size="10" fill="#FFF" letter-spacing="1">C++</text>
      <text x="108" y="258" class="font-mono" font-size="7" fill="#666">EXP: 3 yrs</text>
    </g>

    <!-- HUD Sweep -->
    <line x1="180" y1="150" x2="300" y2="150" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.4" filter="drop-shadow(0 0 4px rgba(255,255,255,0.3))">
      <animateTransform attributeName="transform" type="rotate" from="0 180 150" to="360 180 150" dur="6s" repeatCount="indefinite" />
    </line>

    <!-- Degree Markers -->
    <text x="173" y="14" class="font-mono" font-size="7" fill="#444">000°</text>
    <text x="310" y="152" class="font-mono" font-size="7" fill="#444">090°</text>
    <text x="173" y="295" class="font-mono" font-size="7" fill="#444">180°</text>
    <text x="30" y="152" class="font-mono" font-size="7" fill="#444">270°</text>
  </g>

  <!-- Divider -->
  <line x1="340" y1="25" x2="340" y2="275" stroke="#1C1C1C" stroke-width="1" />

  <!-- RIGHT: Proficiency Bars -->
  <g transform="translate(365, 20)">
    <!-- Header -->
    <text x="10" y="28" class="font-mono" font-size="9" fill="#555" letter-spacing="2">PROFICIENCY :: TELEMETRY</text>
    <line x1="10" y1="36" x2="450" y2="36" stroke="#1A1A1A" stroke-width="1" />

    <!-- 1. Kotlin -->
    <g transform="translate(10, 60)" class="fade-item delay-1">
      <text x="0" y="16" class="font-mono" font-size="13" fill="#FFF" letter-spacing="1" font-weight="500">KOTLIN</text>
      <text x="120" y="16" class="font-mono" font-size="9" fill="#555">ANDROID · KTOR · COROUTINES</text>
      <!-- Bar Track -->
      <line x1="0" y1="38" x2="450" y2="38" class="bar-track" />
      <!-- Bar Fill (85%) -->
      <line x1="0" y1="38" x2="382" y2="38" class="bar-fill-stroke bar-fill bar-glow" style="--target: 68px;" />
      <text x="420" y="16" class="font-mono" font-size="11" fill="#FFF">85%</text>
    </g>

    <!-- 2. Python -->
    <g transform="translate(10, 125)" class="fade-item delay-2">
      <text x="0" y="16" class="font-mono" font-size="13" fill="#FFF" letter-spacing="1" font-weight="500">PYTHON</text>
      <text x="120" y="16" class="font-mono" font-size="9" fill="#555">FASTAPI · DS · AUTOMATION</text>
      <!-- Bar Track -->
      <line x1="0" y1="38" x2="450" y2="38" class="bar-track" />
      <!-- Bar Fill (90%) -->
      <line x1="0" y1="38" x2="405" y2="38" class="bar-fill-stroke bar-fill bar-glow" style="--target: 45px;" />
      <text x="420" y="16" class="font-mono" font-size="11" fill="#FFF">90%</text>
    </g>

    <!-- 3. C++ -->
    <g transform="translate(10, 190)" class="fade-item delay-3">
      <text x="0" y="16" class="font-mono" font-size="13" fill="#FFF" letter-spacing="1" font-weight="500">C++</text>
      <text x="120" y="16" class="font-mono" font-size="9" fill="#555">ALGORITHMS · SYSTEMS · GAME DEV</text>
      <!-- Bar Track -->
      <line x1="0" y1="38" x2="450" y2="38" class="bar-track" />
      <!-- Bar Fill (75%) -->
      <line x1="0" y1="38" x2="337" y2="38" class="bar-fill-stroke bar-fill bar-glow" style="--target: 113px;" />
      <text x="420" y="16" class="font-mono" font-size="11" fill="#FFF">75%</text>
    </g>

    <!-- Terminal Line at Bottom -->
    <g transform="translate(10, 250)">
      <text class="font-mono" font-size="8" fill="#555">&gt; skill_matrix --analyze --lang=all</text>
      <text x="0" y="14" class="font-mono" font-size="8" fill="#888">ANALYSIS: 3 LANGUAGES · CORE PROFICIENCY ESTABLISHED</text>
      <rect x="152" y="5" width="4" height="7" fill="#FFF" class="blink-cursor" />
    </g>
  </g>

  <!-- Corner Accents -->
  <path d="M 14 14 L 14 26 M 14 14 L 26 14" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M 834 14 L 834 26 M 834 14 L 822 14" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M 14 284 L 14 272 M 14 284 L 26 284" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M 834 284 L 834 272 M 834 284 L 822 284" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.4" />
</svg>
