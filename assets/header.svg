<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap');
      .t { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
  </defs>

  <!-- Card -->
  <rect width="848" height="198" x="1" y="1" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1" />

  <!-- Left color block -->
  <rect x="1" y="1" width="6" height="198" rx="3" fill="#111" />

  <!-- Name row -->
  <text x="40" y="72" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="42" font-weight="700" fill="#111" letter-spacing="-1">Naman Mittal</text>

  <!-- Role -->
  <text x="40" y="100" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="14" fill="#6b7280" font-weight="400" letter-spacing="0.3">Creative Technologist</text>
  <circle cx="190" cy="96" r="2" fill="#d1d5db" />
  <text x="200" y="100" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="14" fill="#6b7280" font-weight="400">Delhi, India</text>

  <!-- Divider -->
  <line x1="40" y1="118" x2="250" y2="118" stroke="#f3f4f6" stroke-width="1" />

  <!-- Language tags -->
  <rect x="40" y="135" height="26" width="62" rx="6" fill="#f3f4f6" />
  <text x="71" y="152" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="500">Kotlin</text>

  <rect x="108" y="135" height="26" width="66" rx="6" fill="#f3f4f6" />
  <text x="141" y="152" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="500">Python</text>

  <rect x="180" y="135" height="26" width="46" rx="6" fill="#f3f4f6" />
  <text x="203" y="152" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="12" fill="#111" text-anchor="middle" font-weight="500">C++</text>

  <!-- Right side: subtle terminal accent -->
  <rect x="660" y="40" width="150" height="120" rx="8" fill="#fafafa" stroke="#f3f4f6" stroke-width="1" />
  <rect x="668" y="48" width="134" height="14" rx="3" fill="#f3f4f6" />
  <circle cx="675" cy="55" r="3" fill="#d1d5db" />
  <circle cx="685" cy="55" r="3" fill="#d1d5db" />
  <circle cx="695" cy="55" r="3" fill="#d1d5db" />
  <text x="710" y="113" font-family="'Inter',system-ui,-apple-system,sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle" font-weight="500">data class Developer</text>
</svg>
