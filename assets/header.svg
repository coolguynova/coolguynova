<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="280">
  <defs>
    <!-- Font imports with fallbacks -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap');
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>

    <!-- Typing cursor blink animation -->
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes fadeInUp {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes slideIn {
        0% { opacity: 0; transform: translateX(-12px); }
        100% { opacity: 1; transform: translateX(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.15; }
      }
      @keyframes lineGrow {
        0% { stroke-dashoffset: 300; }
        100% { stroke-dashoffset: 0; }
      }
      .cursor { animation: blink 1s step-end infinite; }
      .line-1 { animation: fadeInUp 0.5s ease-out 0.1s both; }
      .line-2 { animation: fadeInUp 0.5s ease-out 0.3s both; }
      .line-3 { animation: fadeInUp 0.5s ease-out 0.5s both; }
      .line-4 { animation: fadeInUp 0.5s ease-out 0.7s both; }
      .line-5 { animation: fadeInUp 0.5s ease-out 0.9s both; }
      .draw-line { stroke-dasharray: 300; animation: lineGrow 1s ease-out 0.5s both; }
      .pulse-dot { animation: pulse 2s ease-in-out infinite; }
    </style>

  </defs>

  <!-- Card background - clean white with thin border -->
  <rect width="848" height="278" x="1" y="1" rx="16" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1.5" />

  <!-- Top accent bar - subtle gradient -->
  <rect x="1" y="1" width="848" height="4" rx="2" fill="#1a1a1a" />

  <!-- Terminal window chrome -->
  <g transform="translate(32, 24)">
    <!-- Window dots -->
    <circle cx="8" cy="8" r="5" fill="#FF5F57" />
    <circle cx="26" cy="8" r="5" fill="#FFBD2E" />
    <circle cx="44" cy="8" r="5" fill="#28C840" />

    <!-- Window title -->
    <text x="64" y="13" class="mono" font-size="11" fill="#999" font-weight="400">~/coolguynova/profile</text>

    <!-- Terminal line 1: command -->
    <g class="line-1">
      <text x="0" y="44" class="mono" font-size="13" fill="#666">$</text>
      <text x="16" y="44" class="mono" font-size="13" fill="#333" font-weight="500">cat about.md</text>
    </g>

    <!-- Terminal line 2: output - name with glow -->
    <g class="line-2">
      <text x="0" y="72" class="sans" font-size="42" fill="#111" font-weight="700" letter-spacing="-1">Naman Mittal</text>
    </g>

    <!-- Terminal line 3: role -->
    <g class="line-3">
      <text x="0" y="102" class="sans" font-size="17" fill="#555" font-weight="400" letter-spacing="0.3">Full Stack Developer</text>
      <!-- Decorative dot -->
      <circle cx="214" cy="97" r="3" fill="#DDD" />
      <text x="226" y="102" class="sans" font-size="15" fill="#888" font-weight="400">building things that matter</text>
    </g>

    <!-- Terminal line 4: tagline -->
    <g class="line-4">
      <text x="0" y="132" class="mono" font-size="12" fill="#888">// Turning coffee into code since 2022</text>
    </g>

    <!-- Terminal line 5: repo URL / status with blinking cursor -->
    <g class="line-5">
      <text x="0" y="168" class="mono" font-size="12" fill="#444">$</text>
      <text x="16" y="168" class="mono" font-size="12" fill="#444">gh repo view coolguynova/coolguynova</text>
      <text x="260" y="168" class="mono" font-size="12" fill="#888"># status: </text>
      <text x="334" y="168" class="mono" font-size="12" fill="#222" font-weight="500">active</text>
      <rect x="380" y="156" width="7" height="12" fill="#111" class="cursor" />
    </g>

    <!-- Bottom accent line -->
    <line x1="0" y1="200" x2="780" y2="200" stroke="#F0F0F0" stroke-width="1" class="draw-line" />

    <!-- Quick stats row (shields.io style inline) -->
    <g transform="translate(0, 216)">
      <!-- Location chip -->
      <rect x="0" y="0" width="100" height="28" rx="6" fill="#F5F5F5" />
      <text x="12" y="18" class="sans" font-size="12" fill="#555" font-weight="500">📍 Delhi, India</text>

      <!-- Languages chip -->
      <rect x="110" y="0" width="128" height="28" rx="6" fill="#F5F5F5" />
      <text x="122" y="18" class="sans" font-size="12" fill="#555" font-weight="500">Kotlin · Python · C++</text>

      <!-- Status chip -->
      <rect x="248" y="0" width="110" height="28" rx="6" fill="#F5F5F5" />
      <circle cx="262" cy="14" r="4" fill="#28C840" class="pulse-dot" />
      <text x="274" y="18" class="sans" font-size="12" fill="#555" font-weight="500">Open to work</text>
    </g>
  </g>
</svg>
