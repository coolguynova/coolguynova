<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap');

      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      @keyframes growLine {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      .cur { animation: blink 1s step-end infinite; }
      .l1 { animation: fadeUp 0.4s ease-out 0.1s both; }
      .l2 { animation: fadeUp 0.4s ease-out 0.3s both; }
      .l3 { animation: fadeUp 0.4s ease-out 0.5s both; }
      .l4 { animation: fadeUp 0.4s ease-out 0.7s both; }
      .l5 { animation: fadeUp 0.4s ease-out 0.9s both; }
      .gl { stroke-dasharray: 400; animation: growLine 0.8s ease-out 0.6s both; }
      .pd { animation: pulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card -->
  <rect width="848" height="248" x="1" y="1" rx="14" fill="#FFF" stroke="#E8E8E8" stroke-width="1.5" />
  <rect x="1" y="1" width="848" height="3" rx="1.5" fill="#111" />

  <g transform="translate(30, 22)">
    <circle cx="8" cy="8" r="5" fill="#FF5F57" />
    <circle cx="26" cy="8" r="5" fill="#FFBD2E" />
    <circle cx="44" cy="8" r="5" fill="#28C840" />
    <text x="64" y="13" class="mono" font-size="11" fill="#A0A0A0">~/profile</text>

    <g class="l1">
      <text x="0" y="48" class="mono" font-size="13" fill="#888">$ cat about.md</text>
    </g>

    <g class="l2">
      <text x="0" y="90" class="sans" font-size="44" fill="#111" font-weight="700" letter-spacing="-1">Naman Mittal</text>
    </g>

    <g class="l3">
      <text x="0" y="122" class="sans" font-size="18" fill="#555" font-weight="400">Full Stack Developer</text>
      <circle cx="225" cy="116" r="3" fill="#DDD" />
      <text x="238" y="122" class="sans" font-size="15" fill="#999" font-weight="400">building things that matter</text>
    </g>

    <g class="l4">
      <text x="0" y="152" class="mono" font-size="12" fill="#AAA">// coffee → code since 2022</text>
    </g>

    <g class="l5">
      <text x="0" y="186" class="mono" font-size="12" fill="#666">$ gh status</text>
      <text x="100" y="186" class="mono" font-size="12" fill="#888"># </text>
      <text x="114" y="186" class="mono" font-size="12" fill="#222" font-weight="500">active</text>
      <rect x="165" y="174" width="7" height="12" fill="#111" class="cur" />
    </g>

    <line x1="0" y1="208" x2="790" y2="208" stroke="#F0F0F0" stroke-width="1" class="gl" />

    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="95" height="26" rx="6" fill="#F5F5F5" />
      <text x="10" y="17" class="sans" font-size="11" fill="#555" font-weight="500">&#x1F4CD; Delhi, India</text>

      <rect x="105" y="0" width="125" height="26" rx="6" fill="#F5F5F5" />
      <text x="115" y="17" class="sans" font-size="11" fill="#555" font-weight="500">Kotlin · Python · C++</text>

      <rect x="240" y="0" width="105" height="26" rx="6" fill="#F5F5F5" />
      <circle cx="252" cy="13" r="4" fill="#28C840" class="pd" />
      <text x="264" y="17" class="sans" font-size="11" fill="#555" font-weight="500">Open to work</text>
    </g>
  </g>
</svg>
