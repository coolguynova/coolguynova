<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="200">
  <!-- No external fonts, no Google imports, no animations -->
  <!-- Just pure SVG shapes — bulletproof rendering on all platforms -->

  <!-- Card background -->
  <rect width="848" height="198" x="1" y="1" rx="12" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5" />

  <!-- Top accent bar -->
  <rect x="1" y="1" width="848" height="3" rx="1.5" fill="#111111" />

  <!-- LEFT SECTION -->
  <!-- Name -->
  <text x="32" y="72" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="36" fill="#111111" font-weight="bold" letter-spacing="-0.5">Naman Mittal</text>

  <!-- Role -->
  <text x="32" y="100" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#666666">Full Stack Developer</text>

  <!-- Small dot -->
  <circle cx="210" cy="94" r="3" fill="#CCCCCC" />

  <!-- Tagline -->
  <text x="222" y="100" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#999999">building things that matter</text>

  <!-- Divider line -->
  <line x1="32" y1="118" x2="480" y2="118" stroke="#F0F0F0" stroke-width="1.5" />

  <!-- Location chip -->
  <rect x="32" y="138" width="110" height="26" rx="6" fill="#F5F5F5" />
  <text x="44" y="155" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#555555">&#x1F4CD; Delhi, India</text>

  <!-- Languages chip -->
  <rect x="150" y="138" width="150" height="26" rx="6" fill="#F5F5F5" />
  <text x="162" y="155" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#555555">Kotlin &#xB7; Python &#xB7; C++</text>

  <!-- Status chip -->
  <rect x="308" y="138" width="125" height="26" rx="6" fill="#F5F5F5" />
  <circle cx="320" cy="151" r="4" fill="#22C55E" />
  <text x="332" y="155" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#555555">Open to work</text>

  <!-- RIGHT SECTION - Terminal accent box -->
  <rect x="610" y="28" width="210" height="140" rx="8" fill="#FAFAFA" stroke="#EEEEEE" stroke-width="1" />

  <!-- Terminal dots -->
  <circle cx="624" cy="44" r="4" fill="#FF5F57" />
  <circle cx="638" cy="44" r="4" fill="#FFBD2E" />
  <circle cx="652" cy="44" r="4" fill="#22C55E" />

  <!-- Terminal title -->
  <text x="668" y="49" font-family="'Courier New', monospace" font-size="10" fill="#AAAAAA">~/profile</text>

  <!-- Terminal prompt line -->
  <text x="622" y="78" font-family="'Courier New', monospace" font-size="13" fill="#888888">$ cat about.md</text>

  <!-- Terminal output -->
  <text x="622" y="108" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="18" fill="#111111" font-weight="bold">Naman Mittal</text>

  <!-- Terminal second prompt -->
  <text x="622" y="138" font-family="'Courier New', monospace" font-size="12" fill="#888888">$ <tspan fill="#22C55E">_</tspan></text>

  <!-- Bottom accent line -->
  <line x1="610" y1="160" x2="820" y2="160" stroke="#F0F0F0" stroke-width="1" />

  <!-- Small footer text -->
  <text x="622" y="158" font-family="'Courier New', monospace" font-size="9" fill="#CCCCCC">// coffee to code since 2022</text>
</svg>
