<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap');
      .sans { font-family: 'Space Grotesk', 'Segoe UI', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="848" height="218" x="1" y="1" rx="16" fill="#FAFAFA" stroke="#E8E8E8" stroke-width="1.5" />

  <!-- Geometric accent - diagonal slash -->
  <line x1="40" y1="0" x2="100" y2="220" stroke="#000" stroke-width="3" opacity="0.08" />
  <line x1="48" y1="0" x2="108" y2="220" stroke="#000" stroke-width="1" opacity="0.05" />

  <!-- Small accent dot -->
  <circle cx="50" cy="50" r="6" fill="#000" opacity="0.1" />

  <!-- Name -->
  <text x="70" y="105" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="56" font-weight="700" fill="#111" letter-spacing="-1.5">NAMAN MITTAL</text>

  <!-- Subtitle -->
  <text x="70" y="138" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="15" fill="#666" letter-spacing="1" font-weight="400">CREATIVE TECHNOLOGIST · KOTLIN · PYTHON · C++</text>

  <!-- Subtle divider -->
  <line x1="70" y1="160" x2="350" y2="160" stroke="#DDD" stroke-width="1" />

  <!-- Location + status chips -->
  <rect x="70" y="175" width="90" height="24" rx="12" fill="#F0F0F0" />
  <text x="115" y="191" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="11" fill="#555" text-anchor="middle" font-weight="500">📍 Delhi, India</text>

  <rect x="170" y="175" width="100" height="24" rx="12" fill="#F0F0F0" />
  <text x="220" y="191" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="11" fill="#555" text-anchor="middle" font-weight="500">💻 Open to work</text>

  <!-- Right side minimal geometric composition -->
  <g transform="translate(660, 50)" opacity="0.12">
    <rect x="0" y="0" width="40" height="40" fill="none" stroke="#000" stroke-width="2" rx="4" />
    <rect x="15" y="15" width="40" height="40" fill="none" stroke="#000" stroke-width="2" rx="4" />
    <line x1="0" y1="40" x2="40" y2="40" stroke="#000" stroke-width="1" />
    <line x1="40" y1="0" x2="40" y2="40" stroke="#000" stroke-width="1" />
  </g>
</svg>
