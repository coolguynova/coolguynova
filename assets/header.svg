<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="280">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&amp;display=swap');
      
      .font-mono { font-family: 'JetBrains Mono', monospace; }

      /* Animations */
      @keyframes scanline {
        0% { transform: translateY(-280px); }
        100% { transform: translateY(280px); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulse-ring {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      @keyframes glow {
        0%, 100% { text-shadow: 0 0 4px rgba(255,255,255,0.15); }
        50% { text-shadow: 0 0 12px rgba(255,255,255,0.35), 0 0 24px rgba(255,255,255,0.1); }
      }
      @keyframes slide-up {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes dot-pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes equalizer {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1); }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .anim-scanline { animation: scanline 8s linear infinite; }
      .anim-blink { animation: blink 1.2s step-end infinite; }
      .anim-pulse-ring { transform-origin: 700px 140px; animation: pulse-ring 3s ease-in-out infinite; }
      .anim-glow { animation: glow 4s ease-in-out infinite; }
      .anim-slide { animation: slide-up 0.6s ease-out both; }
      .anim-dot-1 { animation: dot-pulse 1.8s ease-in-out infinite; }
      .anim-dot-2 { animation: dot-pulse 2.4s ease-in-out infinite 0.3s; }
      .anim-dot-3 { animation: dot-pulse 2.0s ease-in-out infinite 0.6s; }
      .eq-1 { transform-origin: 755px 30px; animation: equalizer 1.2s ease-in-out infinite; }
      .eq-2 { transform-origin: 762px 30px; animation: equalizer 0.9s ease-in-out infinite 0.2s; }
      .eq-3 { transform-origin: 769px 30px; animation: equalizer 1.4s ease-in-out infinite 0.4s; }
      .eq-4 { transform-origin: 776px 30px; animation: equalizer 1.0s ease-in-out infinite 0.1s; }
      .anim-orbit { transform-origin: 700px 140px; animation: orbit 15s linear infinite; }
      .anim-orbit-rev { transform-origin: 700px 140px; animation: orbit 20s linear infinite reverse; }

      /* Styles */
      .bg-panel { fill: #080808; stroke: #1C1C1C; stroke-width: 1.5; }
      .grid-pattern { stroke: #111111; stroke-width: 0.6; }
      .divider { stroke: #1C1C1C; stroke-width: 1; }
      .divider-thick { stroke: #1A1A1A; stroke-width: 1.5; }
      .accent-dot { fill: #FFFFFF; }
      .text-muted { fill: #555555; }
      .text-secondary { fill: #888888; }
      .text-primary { fill: #FFFFFF; }
      .text-green { fill: #B0B0B0; }
    </style>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" class="grid-pattern"/>
    </pattern>
    <linearGradient id="scan-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFF" stop-opacity="0.025" />
      <stop offset="100%" stop-color="#FFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="848" height="278" x="1" y="1" rx="10" class="bg-panel" />
  <rect width="846" height="276" x="2" y="2" fill="url(#grid)" rx="10" />
  <rect width="846" height="120" x="2" y="2" fill="url(#scan-grad)" class="anim-scanline" pointer-events="none" />

  <!-- Terminal Title Bar -->
  <g transform="translate(15, 12)">
    <circle cx="8" cy="8" r="4.5" fill="#1E1E1E" stroke="#333" stroke-width="0.5" />
    <circle cx="22" cy="8" r="4.5" fill="#1E1E1E" stroke="#333" stroke-width="0.5" />
    <circle cx="36" cy="8" r="4.5" fill="#1E1E1E" stroke="#333" stroke-width="0.5" />
    <text x="50" y="13" class="font-mono" font-size="8" fill="#555" letter-spacing="1.5">~/profile/README.md</text>

    <!-- Equalizer animation -->
    <rect x="750" y="4" width="3" height="8" fill="#FFF" class="eq-1" />
    <rect x="757" y="4" width="3" height="8" fill="#FFF" class="eq-2" />
    <rect x="764" y="4" width="3" height="8" fill="#FFF" class="eq-3" />
    <rect x="771" y="4" width="3" height="8" fill="#FFF" class="eq-4" />
  </g>
  <line x1="15" y1="28" x2="835" y2="28" class="divider" />

  <!-- LEFT COLUMN: Identity -->
  <g transform="translate(35, 52)">
    <!-- Decorator line -->
    <line x1="-12" y1="0" x2="-12" y2="55" stroke="#FFF" stroke-width="2" />
    <line x1="-12" y1="0" x2="6" y2="0" stroke="#FFF" stroke-width="2" />

    <text x="8" y="22" class="font-mono text-primary" font-size="36" font-weight="800" letter-spacing="3" class="anim-glow">NAMAN MITTAL</text>
    <text x="8" y="44" class="font-mono text-secondary" font-size="11" letter-spacing="3">CREATIVE TECHNOLOGIST &amp; INTERACTIVE DEVELOPER</text>

    <line x1="-12" y1="62" x2="400" y2="62" class="divider-thick" />

    <!-- System Info -->
    <g transform="translate(0, 80)" class="anim-slide">
      <text x="0" y="14" class="font-mono" font-size="10" fill="#555">LOCATION :</text>
      <text x="90" y="14" class="font-mono text-secondary" font-size="10">Delhi, India</text>

      <text x="0" y="30" class="font-mono" font-size="10" fill="#555">STATUS   :</text>
      <text x="90" y="30" class="font-mono text-green" font-size="10">Available for opportunities</text>
      <circle cx="220" cy="26" r="3" fill="#FFF" class="anim-dot-1" />

      <text x="0" y="46" class="font-mono" font-size="10" fill="#555">LANGUAGES :</text>
      <text x="90" y="46" class="font-mono text-primary" font-size="10">Kotlin · Python · C++</text>
    </g>

    <!-- Bottom Console -->
    <rect x="-12" y="148" width="395" height="42" fill="#0C0C0C" stroke="#1A1A1A" rx="4" />
    <g transform="translate(6, 160)">
      <text class="font-mono" font-size="9" fill="#666">&gt; ./coolguynova --status --verbose</text>
      <text class="font-mono" font-size="9" fill="#FFF" y="13">SYSTEM: OPERATIONAL · 3 LANGUAGES LOCKED · READY</text>
      <rect x="172" y="4" width="5" height="8" fill="#FFF" class="anim-blink" />
    </g>
  </g>

  <!-- Divider -->
  <line x1="435" y1="45" x2="435" y2="248" class="divider-thick" stroke-dasharray="6, 4" />

  <!-- RIGHT COLUMN: Language Orbital -->
  <g transform="translate(455, 60)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="180" height="195" fill="none" stroke="#1F1F1F" rx="6" />
    <path d="M 0 22 L 180 22" stroke="#1F1F1F" stroke-width="1" />
    <text x="10" y="15" class="font-mono" font-size="8" fill="#555" letter-spacing="1.5">LANG::ORBIT</text>
  </g>

  <!-- Orbital Center Node -->
  <circle cx="545" cy="158" r="8" fill="#0A0A0A" stroke="#444" stroke-width="1" />
  <circle cx="545" cy="158" r="3" fill="#FFF" class="anim-dot-2" />

  <!-- Outer Orbit 1 - Kotlin -->
  <g class="anim-orbit">
    <circle cx="545" cy="158" r="55" fill="none" stroke="#1C1C1C" stroke-width="0.75" stroke-dasharray="3, 4" />
    <g transform="translate(545, 103)">
      <circle cx="0" cy="0" r="14" fill="#0A0A0A" stroke="#555" stroke-width="0.75" />
      <text x="-20" y="4" class="font-mono" font-size="7" fill="#FFF">KOTLIN</text>
    </g>
  </g>

  <!-- Outer Orbit 2 - Python -->
  <g class="anim-orbit-rev">
    <circle cx="545" cy="158" r="75" fill="none" stroke="#1C1C1C" stroke-width="0.75" stroke-dasharray="3, 4" />
    <g transform="translate(545, 233)">
      <circle cx="0" cy="0" r="14" fill="#0A0A0A" stroke="#555" stroke-width="0.75" />
      <text x="-22" y="4" class="font-mono" font-size="7" fill="#FFF">PYTHON</text>
    </g>
  </g>

  <!-- Outer Orbit 3 - C++ -->
  <g class="anim-orbit" style="animation-duration: 25s">
    <circle cx="545" cy="158" r="92" fill="none" stroke="#1C1C1C" stroke-width="0.75" stroke-dasharray="3, 4" />
    <g transform="translate(637, 158)">
      <circle cx="0" cy="0" r="14" fill="#0A0A0A" stroke="#555" stroke-width="0.75" />
      <text x="-12" y="4" class="font-mono" font-size="7" fill="#FFF">C++</text>
    </g>
  </g>

  <!-- HUD Footer -->
  <g transform="translate(520, 245)" opacity="0.5">
    <text class="font-mono" font-size="7" fill="#666">NODES: 3 ACTIVE</text>
    <text class="font-mono" font-size="7" fill="#666" y="10">SIGNAL: STABLE</text>
    <rect x="78" y="-4" width="10" height="3" fill="#FFF" />
    <rect x="91" y="-4" width="10" height="3" fill="#444" />
  </g>

  <!-- Corner Accents -->
  <path d="M 14 14 L 14 26 M 14 14 L 26 14" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.5" />
  <path d="M 834 14 L 834 26 M 834 14 L 822 14" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.5" />
  <path d="M 14 264 L 14 252 M 14 264 L 26 264" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.5" />
  <path d="M 834 264 L 834 252 M 834 264 L 822 264" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.5" />
</svg>
