<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&amp;display=swap');

      .font-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }

      @keyframes bar-wave {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1); }
      }
      @keyframes dot-flash {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }
      @keyframes draw-line {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes count-up {
        0% { opacity: 0; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .bar-1 { transform-origin: 12px 32px; animation: bar-wave 1.4s ease-in-out infinite; }
      .bar-2 { transform-origin: 24px 32px; animation: bar-wave 1.0s ease-in-out infinite 0.15s; }
      .bar-3 { transform-origin: 36px 32px; animation: bar-wave 1.8s ease-in-out infinite 0.3s; }
      .bar-4 { transform-origin: 48px 32px; animation: bar-wave 1.2s ease-in-out infinite 0.45s; }
      .bar-5 { transform-origin: 60px 32px; animation: bar-wave 0.9s ease-in-out infinite 0.1s; }

      .dot-1 { animation: dot-flash 2s ease-in-out infinite; }
      .dot-2 { animation: dot-flash 2.5s ease-in-out infinite 0.4s; }
      .dot-3 { animation: dot-flash 1.8s ease-in-out infinite 0.8s; }
      .dot-4 { animation: dot-flash 3s ease-in-out infinite 0.2s; }

      .line-draw { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw-line 2s ease-out forwards; }
      .count-anim { animation: count-up 0.6s ease-out both; }

      .bg-panel { fill: #080808; stroke: #1C1C1C; stroke-width: 1.5; }
      .section-divider { stroke: #1C1C1C; stroke-width: 1; }
    </style>
  </defs>

  <!-- Base Panel -->
  <rect width="848" height="158" x="1" y="1" rx="10" class="bg-panel" />

  <!-- Vertical Dividers -->
  <line x1="212" y1="18" x2="212" y2="142" class="section-divider" />
  <line x1="424" y1="18" x2="424" y2="142" class="section-divider" />
  <line x1="636" y1="18" x2="636" y2="142" class="section-divider" />

  <!-- MODULE 1: Experience -->
  <g transform="translate(20, 22)">
    <text x="0" y="12" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#555" letter-spacing="1.5">METRIC // 01</text>
    <g class="count-anim" style="animation-delay: 0.1s;">
      <text x="0" y="48" font-family="'JetBrains Mono','Courier New',monospace" font-size="32" fill="#FFF" font-weight="700">4+<tspan font-size="11" fill="#888" font-weight="400"> YRS</tspan></text>
      <text x="0" y="65" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="#666">CODING EXPERIENCE</text>
    </g>
    <!-- Mini wave -->
    <g transform="translate(0, 82)">
      <line x1="0" y1="10" x2="170" y2="10" stroke="#181818" stroke-width="1.5" />
      <g transform="translate(8, 18)">
        <rect x="0" y="0" width="4" height="14" fill="#FFF" class="bar-1" />
      </g>
      <g transform="translate(20, 18)">
        <rect x="0" y="0" width="4" height="14" fill="#FFF" class="bar-2" />
      </g>
      <g transform="translate(32, 18)">
        <rect x="0" y="0" width="4" height="14" fill="#FFF" class="bar-3" />
      </g>
      <g transform="translate(44, 18)">
        <rect x="0" y="0" width="4" height="14" fill="#FFF" class="bar-4" />
      </g>
      <g transform="translate(56, 18)">
        <rect x="0" y="0" width="4" height="14" fill="#FFF" class="bar-5" />
      </g>
    </g>
  </g>

  <!-- MODULE 2: Repos -->
  <g transform="translate(232, 22)">
    <text x="0" y="12" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#555" letter-spacing="1.5">METRIC // 02</text>
    <g class="count-anim" style="animation-delay: 0.25s;">
      <text x="0" y="48" font-family="'JetBrains Mono','Courier New',monospace" font-size="32" fill="#FFF" font-weight="700">10+<tspan font-size="11" fill="#888" font-weight="400"> BUILDS</tspan></text>
      <text x="0" y="65" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="#666">REPOSITORIES</text>
    </g>
    <!-- Dot Matrix Pattern -->
    <g transform="translate(0, 82)">
      <circle cx="6" cy="8" r="2.5" fill="#FFF" class="dot-1" />
      <circle cx="20" cy="8" r="2.5" fill="#FFF" class="dot-2" />
      <circle cx="34" cy="8" r="2.5" fill="#FFF" class="dot-3" />
      <circle cx="48" cy="8" r="2.5" fill="#FFF" class="dot-4" />
      <circle cx="6" cy="22" r="2.5" fill="#FFF" class="dot-3" />
      <circle cx="20" cy="22" r="2.5" fill="#FFF" class="dot-4" />
      <circle cx="34" cy="22" r="2.5" fill="#FFF" class="dot-1" />
      <circle cx="48" cy="22" r="2.5" fill="#FFF" class="dot-2" />
    </g>
  </g>

  <!-- MODULE 3: Lines of Code -->
  <g transform="translate(444, 22)">
    <text x="0" y="12" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#555" letter-spacing="1.5">METRIC // 03</text>
    <g class="count-anim" style="animation-delay: 0.4s;">
      <text x="0" y="48" font-family="'JetBrains Mono','Courier New',monospace" font-size="32" fill="#FFF" font-weight="700">50K+<tspan font-size="11" fill="#888" font-weight="400"> LINES</tspan></text>
      <text x="0" y="65" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="#666">CODE CONTRIBUTED</text>
    </g>
    <!-- Horizontal graph line -->
    <g transform="translate(0, 82)">
      <path d="M 0 12 L 30 8 L 60 14 L 90 6 L 120 10 L 150 4" fill="none" stroke="#222" stroke-width="1.5" />
      <path d="M 0 12 L 30 8 L 60 14 L 90 6 L 120 10 L 150 4" fill="none" stroke="#FFF" stroke-width="1" class="line-draw" />
    </g>
  </g>

  <!-- MODULE 4: Languages -->
  <g transform="translate(656, 22)">
    <text x="0" y="12" font-family="'JetBrains Mono','Courier New',monospace" font-size="8" fill="#555" letter-spacing="1.5">METRIC // 04</text>
    <g class="count-anim" style="animation-delay: 0.55s;">
      <text x="0" y="48" font-family="'JetBrains Mono','Courier New',monospace" font-size="32" fill="#FFF" font-weight="700">3<tspan font-size="11" fill="#888" font-weight="400"> LANG</tspan></text>
      <text x="0" y="65" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" fill="#666">CORE STACK</text>
    </g>
    <!-- Orbital Dots -->
    <g transform="translate(70, 82)">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#222" stroke-width="1" />
      <circle cx="12" cy="12" r="14" fill="none" stroke="#333" stroke-width="0.5" stroke-dasharray="2, 2" />
      <circle cx="12" cy="12" r="4" fill="#FFF" class="dot-2" />
    </g>
  </g>

  <!-- Corner Accents -->
  <path d="M 14 14 L 14 26 M 14 14 L 26 14" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M 834 14 L 834 26 M 834 14 L 822 14" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M 14 144 L 14 132 M 14 144 L 26 144" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M 834 144 L 834 132 M 834 144 L 822 144" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.4" />
</svg>
